[package]
name = "dyt-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "brotli", "stream", "http2"] }
rquickjs = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
webpki-root-certs = "1.0.11"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tokio = { version = "1.54.1", features = ["full"] }

# rquickjs ships pre-generated bindings for desktop targets only; Android generates its own.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14.0", features = ["bindgen"] }
